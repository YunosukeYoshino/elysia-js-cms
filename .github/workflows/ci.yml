name: CI

on:
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome Lint Check
        run: bun run lint

      - name: Run Biome Format Check
        run: bun run check

      - name: Generate Prisma Client
        run: bunx prisma generate

      - name: Run TypeScript Type Check
        run: bun run typecheck

      - name: Run Isolated Tests and Service Coverage Gate
        run: bun run test:ci

      - name: Build and Smoke Test Distribution
        run: bun run test:artifact

  isolated-docker-tests:
    name: Isolated Docker Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Run Disposable Database and Redis Suite
        run: docker compose -f compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
      - name: Remove Test Containers
        if: always()
        run: docker compose -f compose.test.yml down --volumes
